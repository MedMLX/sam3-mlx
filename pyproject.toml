[project]
name = "sam3_mlx"
version = "0.1.5"
description = "MLX port of Meta's Segment Anything 3 (SAM 3) for Apple Silicon."
readme = "README.md"
license = "LicenseRef-SAM AND MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.13"
authors = [
    { name = "Alfredo Sandoval" },
]
keywords = [
    "sam3",
    "segment-anything",
    "segmentation",
    "mlx",
    "apple-silicon",
    "computer-vision",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "ftfy>=6.3.1",
    "huggingface-hub>=1.1.6",
    "medmlx-core==0.2.4",
    "mlx>=0.32.4,<0.33",
    "numpy>=2.3.5",
    "pillow>=13,<14",
    "regex>=2025.11.3",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.10.8",
]
video = [
    "opencv-python-headless>=4.10.0",
]

[project.entry-points."medmlx.models"]
sam3 = "sam3_mlx.medmlx:MODEL"

[project.urls]
Homepage = "https://github.com/MedMLX/sam3-mlx"
Repository = "https://github.com/MedMLX/sam3-mlx"
Issues = "https://github.com/MedMLX/sam3-mlx/issues"

[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sam3_mlx", "sam3_mlx.*"]
exclude = [
    "sam3_mlx.agent",
    "sam3_mlx.agent.*",
    "sam3_mlx.eval",
    "sam3_mlx.eval.*",
    "sam3_mlx.perflib.triton",
    "sam3_mlx.perflib.triton.*",
]

[tool.setuptools.package-data]
sam3_mlx = ["assets/*.txt.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [
    ".git",
    ".hypothesis",
    ".venv",
    "third_party",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["sam3_mlx", "scripts", "tests", "experiments"]
extraPaths = ["third_party/facebook-sam3"]
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
exclude = [
    ".venv",
    "third_party",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B007", "B023", "B026", "BLE001", "TID251", "TID252", "ANN401"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Use concrete types, typed schemas, or protocols."
"typing_extensions.Any".msg = "Use concrete types, typed schemas, or protocols."

[dependency-groups]
dev = [
    "hypothesis>=6.167.0",
    "pyright==1.1.414",
    "pytest-reportlog>=1.0.0",
    "ruff>=0.12.0",
]
oracle = [
    "torch==2.13.0",
    "torchvision==0.28.0",
]

[tool.uv]
constraint-dependencies = ["setuptools>=84.1.0", "filelock>=4.2.1", ]

[tool.uv.sources]
medmlx-core = { git = "https://github.com/MedMLX/medmlx.git", rev = "f98e0924f50228e2b9509474947b9672054b3217", subdirectory = "packages/core" }
