[project]
name = "sam3-mlx"
version = "0.2.4"
description = "Segment objects in images from text, box or point prompts with Meta's SAM 3"
readme = "README.md"
license = "LicenseRef-SAM AND MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Joseph Sandoval" },
    { name = "Alfredo Sandoval Jr." },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
    "sam3",
    "segment-anything",
    "segmentation",
    "mlx",
    "apple-silicon",
    "computer-vision",
    "metal",
    "medical-imaging",
]
dependencies = [
    "ftfy>=6.3.1",
    "huggingface-hub>=1.1.6",
    "medmlx-core==0.2.6",
    "mlx==0.32.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "numpy>=2.3.5",
    "pillow>=13,<14",
    "regex>=2025.11.3",
    "scipy==1.18.1",
]

[project.urls]
Homepage = "https://medmlx.org"
Repository = "https://github.com/MedMLX/sam3-mlx"
Issues = "https://github.com/MedMLX/sam3-mlx/issues"
Weights = "https://huggingface.co/mlx-community/sam3-image"
MedMLX = "https://github.com/MedMLX/medmlx"

[project.optional-dependencies]
video = [
    "opencv-python-headless>=4.10.0",
]

[project.entry-points."medmlx.models"]
sam3 = "sam3_mlx.medmlx:MODEL"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sam3_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
norecursedirs = [
    ".git",
    ".hypothesis",
    ".venv",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
exclude = [
    ".venv",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B007", "B023", "B026", "BLE001", "TID251", "TID252", "ANN401"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = {msg = "Use a precise type and parse dynamic inputs at the boundary."}
"typing_extensions.Any" = {msg = "Use a precise type and parse dynamic inputs at the boundary."}

[dependency-groups]
dev = [
    "hypothesis>=6.167.0",
    "pyright==1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.12.0",
    "scipy-stubs>=1.18.1.1,<1.19",
    # References for the ROI Align, resize and interpolation comparisons.
    "torch==2.13.0",
    "torchvision==0.28.0",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
constraint-dependencies = ["setuptools>=84.1.0", "filelock>=4.2.1"]
